name: Build and Deploy GrenadeOnlyFF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore and Build
        run: |
          dotnet restore src/GrenadeOnlyFF/GrenadeOnlyFF.csproj
          dotnet build src/GrenadeOnlyFF/GrenadeOnlyFF.csproj -c Release

      - name: Pack artifact
        run: |
          mkdir -p artifact
          cp src/GrenadeOnlyFF/bin/Release/net6.0/*.dll artifact/ || true
          cd artifact
          zip -r ../plugin-artifact.zip *
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-artifact
          path: plugin-artifact.zip

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-artifact
          path: .

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PLUGIN_DIR: ${{ secrets.SERVER_PLUGIN_DIR }}
        run: |
          scp -o StrictHostKeyChecking=no plugin-artifact.zip ${SERVER_USER}@${SERVER_HOST}:/tmp/
          ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} <<EOF
            unzip -o /tmp/plugin-artifact.zip -d /tmp/plugin_build
            mv /tmp/plugin_build/*.dll ${SERVER_PLUGIN_DIR}/
            rm -rf /tmp/plugin_build /tmp/plugin-artifact.zip
            # Перезагрузить CS# плагин. Пример: meta reload или команда, подходящая для вашего сервера
            screen -S csserver -p 0 -X stuff "meta reload^M"
EOF
